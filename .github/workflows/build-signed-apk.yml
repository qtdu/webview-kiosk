name: Build Signed APK (Test)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Grant gradlew execute
        run: chmod +x ./gradlew

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
          -keystore debug.keystore \
          -storepass 123456 \
          -alias webviewtest \
          -keypass 123456 \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=Test, OU=Test, O=Test, L=Test, S=Test, C=VN"

      - name: Build APK (Release)
        run: ./gradlew clean assembleRelease -PkeystoreFile=debug.keystore -PkeystorePassword=123456 -PkeyAlias=webviewtest -PkeyPassword=123456

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: webview-kiosk-signed-apk
          path: app/build/outputs/apk/release/*.apk
