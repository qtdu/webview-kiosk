name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Grant gradlew execute
        run: chmod +x ./gradlew

      - name: Build APK (Release, unsigned)
        run: |
          sed -i 's/signingConfig = signingConfigs.getByName("release")/signingConfig = null/' app/build.gradle.kts
          ./gradlew clean assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: webview-kiosk-apk
          path: app/build/outputs/apk/release/*.apk
